<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajuda Eventos Magyver</title><link rel="icon" href="/static/emblema-magyver.png"><style>
:root{--orange:#ff9800;--bg:#080808;--panel:#151515;--line:#303030;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:#050505}.box{width:min(430px,100%);background:#121212;border:1px solid #333;border-radius:20px;padding:26px;box-shadow:0 20px 60px #000}.logo{display:block;width:190px;height:190px;object-fit:contain;margin:auto}.title{text-align:center;font-size:24px;font-weight:900}.sub{text-align:center;color:var(--muted);margin:7px 0 20px}label{display:block;font-size:13px;color:#ddd;margin:12px 0 6px}input,select,textarea{width:100%;background:#090909;color:#fff;border:1px solid #3a3a3a;border-radius:9px;padding:11px}textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800}.primary{background:var(--orange);color:#111}.dark{background:#292929;color:#fff}.danger{background:#461b1b;color:#ffb0b0}.full{width:100%;margin-top:14px}.link{border:0;background:none;color:var(--orange);display:block;margin:12px auto}.top{height:72px;position:sticky;top:0;z-index:20;background:#111;border-bottom:1px solid #292929;display:flex;align-items:center;padding:6px 16px}.top img{width:58px;height:58px;object-fit:contain}.brand{font-weight:900;margin-left:8px}.hamb{margin-left:auto;background:#222;border:1px solid #444;color:#fff;border-radius:8px;padding:10px}.layout{display:flex}.side{width:245px;min-height:calc(100vh - 72px);background:#111;border-right:1px solid #292929;padding:13px;position:sticky;top:72px;height:calc(100vh - 72px)}.nav button{width:100%;display:block;text-align:left;border:0;background:none;color:#ddd;border-radius:8px;padding:11px;margin:2px 0}.nav button:hover,.nav button.active{background:#252525;color:var(--orange)}main{width:min(1450px,100%);margin:auto;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.head h2{margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.stat small{color:var(--muted)}.stat b{display:block;font-size:26px;margin-top:7px}.grid2,.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.span2{grid-column:1/-1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #333;text-align:left}.table th{color:#aaa;font-size:12px}.badge{border-radius:20px;padding:4px 7px;background:#333;font-size:12px}.ok{background:#173d28;color:#8ce0b0}.wait{background:#493a16;color:#ffd879}.bad{background:#431b1b;color:#ffaaaa}.empty{text-align:center;color:#777;padding:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.modal{position:fixed;inset:0;background:#000d;z-index:100;display:none;place-items:center;padding:15px}.modal.show{display:grid}.modalbox{width:min(850px,100%);max-height:94vh;overflow:auto;background:#181818;border:1px solid #444;border-radius:15px;padding:20px}.mh{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;color:#aaa;font-size:26px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:105px;background:#191919;border:1px solid #333;border-radius:8px;padding:7px}.evt{display:block;background:#3b2806;border-left:3px solid var(--orange);padding:4px;margin-top:5px;border-radius:4px;font-size:11px;cursor:pointer}.pixbox{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.piximg{width:180px;height:180px;background:#fff;padding:8px}.fixed{position:fixed;right:14px;bottom:14px;width:58px;height:58px;object-fit:contain;opacity:.9}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.side{width:205px}}@media(max-width:650px){.side{position:fixed;left:-260px;z-index:50;transition:.2s}.side.open{left:0}.cards,.grid2,.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}main{padding:14px}.pixbox{grid-template-columns:1fr}.piximg{margin:auto}}
</style></head><body>
<section id="login" class="login"><div class="box"><img class="logo" src="/static/emblema-magyver.png"><div class="title">Ajuda Eventos Magyver</div><div class="sub">Gestão profissional para eventos de churrasco</div><div id="lf"><label>Login</label><input id="li"><label>Senha</label><input id="lp" type="password"><button class="btn primary full" onclick="login()">Entrar</button><button class="link" onclick="toggleReg()">Criar cadastro</button></div><div id="rf" class="hidden"><label>Nome</label><input id="rn"><label>Login</label><input id="ri"><label>Senha</label><input id="rp" type="password"><button class="btn primary full" onclick="register()">Cadastrar</button><button class="link" onclick="toggleReg()">Voltar</button></div></div></section>
<section id="app" class="hidden"><header class="top"><img src="/static/emblema-magyver.png"><div class="brand">AJUDA EVENTOS MAGYVER</div><button class="hamb" onclick="menu()">☰</button></header><div class="layout"><aside id="side" class="side"><nav id="nav"><button onclick="page('home',this)">🏠 Início</button><button onclick="page('events',this)">📅 Eventos</button><button onclick="page('clients',this)">👥 Clientes / Ficha</button><button onclick="page('finance',this)">💰 Financeiro</button><button onclick="page('equip',this)">🧰 Equipamentos / Checklist</button><button onclick="page('food',this)">🍖 Gastronomia</button><button onclick="page('quotes',this)">💵 Orçamentos</button><button onclick="page('contracts',this)">📄 Contratos</button><button onclick="page('calendar',this)">🗓️ Calendário</button><button onclick="page('settings',this)">⚙️ Configurações</button><button class="danger" onclick="logout()">Sair</button></nav></aside><main id="main"></main></div><img class="fixed" src="/static/emblema-magyver.png"></section>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
let D={},token=localStorage.getItem('magyver_token'),cal=new Date();const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const br=x=>x?x.split('-').reverse().join('/'):'-';const money=x=>Number(x||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
async function api(url,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},token?{Authorization:'Bearer '+token}:{});let r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro');return j}
async function boot(){if(token){try{let m=await api('/api/me');if(m.user){$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();page('home')}else logout()}catch(e){logout()}}}async function load(){D=await api('/api/data')}
function toggleReg(){$('lf').classList.toggle('hidden');$('rf').classList.toggle('hidden')}async function register(){try{await api('/api/register',{method:'POST',body:JSON.stringify({name:$('rn').value,login:$('ri').value,password:$('rp').value})});alert('Cadastro criado. Agora faça o login.');toggleReg()}catch(e){alert(e.message)}}async function login(){try{let x=await api('/api/login',{method:'POST',body:JSON.stringify({login:$('li').value,password:$('lp').value})});token=x.token;localStorage.setItem('magyver_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();page('home')}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('magyver_token');token=null;location.reload()}function menu(){$('side').classList.toggle('open')}
function page(p,b){document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');$('side').classList.remove('open');({home:pHome,events:pEvents,clients:pClients,finance:pFinance,equip:pEquip,food:pFood,quotes:pQuotes,contracts:pContracts,calendar:pCalendar,settings:pSettings}[p]||pHome)();}
function pHome(){let f=D.events.filter(e=>e.date>=new Date().toISOString().slice(0,10));$('main').innerHTML=`<div class=head><div><h2>Início</h2><p style=color:#999>Controle completo dos seus eventos de churrasco.</p></div><button class="btn primary" onclick="eventForm()">+ Novo evento</button></div><div class=cards><div class="card stat"><small>Eventos</small><b>${D.events.length}</b></div><div class="card stat"><small>Clientes</small><b>${D.clients.length}</b></div><div class="card stat"><small>Próximos eventos</small><b>${f.length}</b></div><div class="card stat"><small>Total recebido/lançado</small><b>R$ ${money(D.payments.reduce((a,p)=>a+Number(p.value||0),0))}</b></div></div><div class=card style="margin-top:14px"><h3>Próximos eventos</h3>${f.slice(0,8).map(e=>`<div style="padding:10px 0;border-bottom:1px solid #333"><b>${esc(e.name)}</b><br><small style=color:#999>${br(e.date)} • ${e.time} • ${esc(e.client)} • ${e.people} pessoas</small> <button class="btn dark" onclick="eventView(${e.id})">Abrir</button></div>`).join('')||'<div class=empty>Nenhum evento futuro.</div>'}</div>`}
function pEvents(){$('main').innerHTML=`<div class=head><h2>Eventos</h2><button class="btn primary" onclick="eventForm()">+ Criar evento</button></div><div class="card table"><table><tr><th>Evento</th><th>Cliente</th><th>Data</th><th>Hora</th><th>Pessoas</th><th>Serviço</th><th>Confirmação</th><th></th></tr>${D.events.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.client)}</td><td>${br(e.date)}</td><td>${e.time}</td><td>${e.people}</td><td>${e.service}</td><td><span class="badge ${e.confirm==='Confirmado'?'ok':e.confirm==='Cancelado'?'bad':'wait'}">${esc(e.confirm)}</span></td><td><button class="btn dark" onclick="eventView(${e.id})">Abrir</button></td></tr>`).join('')||'<tr><td colspan=8 class=empty>Nenhum evento.</td></tr>'}</table></div>`}
function show(h){$('modalbox').innerHTML=h;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}
function eventForm(id=''){let e=D.events.find(x=>x.id==id)||{};show(`<div class=mh><h2>${id?'Editar':'Novo'} evento</h2><button class=close onclick=closeM()>×</button></div><div class=formgrid><div><label>Nome do evento</label><input id=en value="${esc(e.name)}"></div><div><label>Cliente</label><input id=ec value="${esc(e.client)}"></div><div><label>Data</label><input id=ed type=date value="${e.date||''}"></div><div><label>Horário</label><input id=et type=time value="${e.time||''}"></div><div class=span2><label>Endereço</label><input id=ea value="${esc(e.address)}"></div><div><label>Quantidade de pessoas</label><input id=ep type=number min=1 value="${e.people||''}"></div><div><label>Serviço</label><select id=es><option ${e.service==='Interno'?'selected':''}>Interno</option><option ${e.service==='Externo'?'selected':''}>Externo</option></select></div><div><label>Confirmação do cliente</label><select id=ex><option>Aguardando confirmação</option><option ${e.confirm==='Confirmado'?'selected':''}>Confirmado</option><option ${e.confirm==='Cancelado'?'selected':''}>Cancelado</option></select></div><div><label>Valor do evento</label><input id=ev type=number step=.01 value="${e.value||''}"></div><div class=span2><label>Observações</label><textarea id=eo>${esc(e.obs)}</textarea></div></div><div class=actions><button class="btn primary" onclick="saveEvent(${id||0})">Salvar</button>${id?`<button class="btn danger" onclick="del('events',${id})">Apagar evento</button>`:''}</div>`)}
async function saveEvent(id){let o={name:en.value,client:ec.value,date:ed.value,time:et.value,address:ea.value,people:Number(ep.value||0),service:es.value,confirm:ex.value,value:Number(ev.value||0),obs:eo.value};if(!o.name||!o.date||!o.time)return alert('Nome, data e horário são obrigatórios.');if(id)o.id=id;try{await api('/api/save',{method:'POST',body:JSON.stringify({type:'events',data:o})});closeM();await load();pEvents()}catch(e){alert(e.message)}}function eventView(id){let e=D.events.find(x=>x.id==id);show(`<div class=mh><h2>${esc(e.name)}</h2><button class=close onclick=closeM()>×</button></div><p><b>Cliente:</b> ${esc(e.client)}<br><b>Data:</b> ${br(e.date)} às ${e.time}<br><b>Endereço:</b> ${esc(e.address)}<br><b>Pessoas:</b> ${e.people}<br><b>Serviço:</b> ${e.service}<br><b>Confirmação:</b> ${e.confirm}<br><b>Valor:</b> R$ ${money(e.value)}</p><div class=actions><button class="btn dark" onclick="closeM();eventForm(${e.id})">Editar</button><button class="btn primary" onclick="paymentForm(${e.id})">+ Pagamento</button></div>`)}
async function del(type,id){if(!confirm('Confirma a exclusão?'))return;try{await api('/api/delete',{method:'POST',body:JSON.stringify({type,id})});closeM();await load();({events:pEvents,clients:pClients,equipment:pEquip,food:pFood,quotes:pQuotes,contracts:pContracts}[type]||pFinance)()}catch(e){alert(e.message)}}
function pClients(){$('main').innerHTML=`<div class=head><h2>Clientes / Ficha</h2><button class="btn primary" onclick="clientForm()">+ Novo cliente</button></div><div class="card table"><table><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Eventos</th><th></th></tr>${D.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${D.events.filter(e=>e.client===c.name).length}</td><td><button class="btn dark" onclick="clientForm(${c.id})">Ficha</button></td></tr>`).join('')||'<tr><td colspan=5 class=empty>Nenhum cliente.</td></tr>'}</table></div>`}
function clientForm(id=''){let c=D.clients.find(x=>x.id==id)||{};show(`<div class=mh><h2>${id?'Ficha do cliente':'Novo cliente'}</h2><button class=close onclick=closeM()>×</button></div><div class=formgrid><div><label>Nome</label><input id=cn value="${esc(c.name)}"></div><div><label>Telefone</label><input id=cpn value="${esc(c.phone)}"></div><div><label>E-mail</label><input id=ce value="${esc(c.email)}"></div><div><label>CPF/CNPJ</label><input id=cd value="${esc(c.doc)}"></div><div class=span2><label>Endereço</label><input id=cad value="${esc(c.address)}"></div><div class=span2><label>Observações</label><textarea id=cob>${esc(c.obs)}</textarea></div></div><div class=actions><button class="btn primary" onclick="saveClient(${id||0})">Salvar</button>${id?`<button class="btn danger" onclick="del('clients',${id})">Apagar</button>`:''}</div>`)}async function saveClient(id){let o={name:cn.value,phone:cpn.value,email:ce.value,doc:cd.value,address:cad.value,obs:cob.value};if(!o.name)return alert('Nome obrigatório.');if(id)o.id=id;await api('/api/save',{method:'POST',body:JSON.stringify({type:'clients',data:o})});closeM();await load();pClients()}
function pFinance(){$('main').innerHTML=`<div class=head><h2>Financeiro</h2><button class="btn primary" onclick="paymentForm()">+ Adicionar pagamento</button></div><div class=cards><div class="card stat"><small>Total lançado</small><b>R$ ${money(D.payments.reduce((a,p)=>a+Number(p.value||0),0))}</b></div></div><div class="card table" style="margin-top:14px"><table><tr><th>Evento</th><th>Etapa</th><th>Valor</th><th>Forma</th><th>Status</th></tr>${D.payments.map(p=>`<tr><td>${esc((D.events.find(e=>e.id==p.event_id)||{}).name||'-')}</td><td>${esc(p.type)}</td><td>R$ ${money(p.value)}</td><td>${esc(p.method)}</td><td>${esc(p.status)}</td></tr>`).join('')||'<tr><td colspan=5 class=empty>Nenhum pagamento.</td></tr>'}</table></div>`}
function paymentForm(event=''){show(`<div class=mh><h2>Pagamento</h2><button class=close onclick=closeM()>×</button></div><div class=formgrid><div><label>Evento</label><select id=pe>${D.events.map(e=>`<option value=${e.id} ${e.id==event?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div><label>Etapa</label><select id=pt><option>Pagamento adiantado</option><option>Pagamento durante o evento</option><option>Pagamento após o evento</option></select></div><div><label>Valor</label><input id=pv type=number step=.01></div><div><label>Forma</label><select id=pm><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></div><div><label>Status</label><select id=ps><option>Pago</option><option>Pendente</option></select></div></div><div class=actions><button class="btn primary" onclick=savePayment()>Salvar</button><button class="btn dark" onclick="closeM();pixPage()">Gerar QR Code PIX</button></div>`)}async function savePayment(){await api('/api/payment',{method:'POST',body:JSON.stringify({event_id:Number(pe.value),type:pt.value,value:Number(pv.value||0),method:pm.value,status:ps.value})});closeM();await load();pFinance()}
function pEquip(){$('main').innerHTML=`<div class=head><h2>Equipamentos / Checklist</h2><button class="btn primary" onclick="addSimple('equipment','Nome do equipamento')">+ Adicionar</button></div><div class=card>${D.equipment.map(e=>`<label style="padding:9px 0;border-bottom:1px solid #333"><input type=checkbox style="width:auto;margin-right:8px" ${e.checked?'checked':''} onchange="toggleEquip(${e.id},this.checked)"> ${esc(e.name)}</label>`).join('')||'<div class=empty>Nenhum equipamento.</div>'}<div class=actions><button class="btn dark" onclick="markEquip(1)">Marcar todos</button><button class="btn dark" onclick="markEquip(0)">Desmarcar todos</button></div></div>`}async function toggleEquip(id,v){let e=D.equipment.find(x=>x.id==id);e.checked=v?1:0;await api('/api/save',{method:'POST',body:JSON.stringify({type:'equipment',data:e})})}async function markEquip(v){for(let e of D.equipment){e.checked=v?1:0;await api('/api/save',{method:'POST',body:JSON.stringify({type:'equipment',data:e})})}await load();pEquip()}async function addSimple(type,label){let n=prompt(label);if(!n)return;await api('/api/save',{method:'POST',body:JSON.stringify({type,data:type==='equipment'?{name:n,checked:0}:{name:n,cat:'Outros',qty:'1',obs:''}})});await load();type==='equipment'?pEquip():pFood()}
function pFood(){$('main').innerHTML=`<div class=head><h2>Gastronomia</h2><button class="btn primary" onclick="foodForm()">+ Adicionar item</button></div><div class="card table"><table><tr><th>Item</th><th>Categoria</th><th>Quantidade</th><th>Observação</th></tr>${D.food.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.cat)}</td><td>${esc(f.qty)}</td><td>${esc(f.obs)}</td></tr>`).join('')||'<tr><td colspan=4 class=empty>Nenhum item.</td></tr>'}</table></div>`}function foodForm(){show(`<div class=mh><h2>Item gastronômico</h2><button class=close onclick=closeM()>×</button></div><div class=formgrid><div><label>Item</label><input id=fn></div><div><label>Categoria</label><input id=fc value="Carnes"></div><div><label>Quantidade</label><input id=fq value="1"></div><div><label>Observação</label><input id=fo></div></div><button class="btn primary" style="margin-top:14px" onclick=saveFood()>Salvar</button>`)}async function saveFood(){await api('/api/save',{method:'POST',body:JSON.stringify({type:'food',data:{name:fn.value,cat:fc.value,qty:fq.value,obs:fo.value}})});closeM();await load();pFood()}
function pQuotes(){$('main').innerHTML=`<div class=head><h2>Orçamentos</h2><button class="btn primary" onclick="quoteForm()">+ Novo orçamento</button></div><div class="card table"><table><tr><th>Cliente</th><th>Evento</th><th>Pessoas</th><th>Serviço</th><th>Valor</th><th>Status</th></tr>${D.quotes.map(q=>`<tr><td>${esc(q.client)}</td><td>${esc(q.event)}</td><td>${q.people}</td><td>${q.service}</td><td>R$ ${money(q.value)}</td><td>${esc(q.status)}</td></tr>`).join('')||'<tr><td colspan=6 class=empty>Nenhum orçamento.</td></tr>'}</table></div>`}function quoteForm(){show(`<div class=mh><h2>Novo orçamento</h2><button class=close onclick=closeM()>×</button></div><div class=formgrid><div><label>Cliente</label><input id=qc></div><div><label>Evento</label><input id=qe></div><div><label>Pessoas</label><input id=qp type=number></div><div><label>Serviço</label><select id=qs><option>Interno</option><option>Externo</option></select></div><div><label>Valor</label><input id=qv type=number step=.01></div><div><label>Status</label><select id=qx><option>Em elaboração</option><option>Enviado</option><option>Aguardando resposta</option><option>Aprovado</option><option>Recusado</option></select></div></div><button class="btn primary" style="margin-top:14px" onclick=saveQuote()>Salvar</button>`)}async function saveQuote(){await api('/api/save',{method:'POST',body:JSON.stringify({type:'quotes',data:{client:qc.value,event:qe.value,people:Number(qp.value||0),service:qs.value,value:Number(qv.value||0),status:qx.value}})});closeM();await load();pQuotes()}
function pContracts(){$('main').innerHTML=`<div class=head><h2>Contratos</h2><button class="btn primary" onclick=contractForm()>+ Novo contrato</button></div><div class="card table"><table><tr><th>Cliente</th><th>Evento</th><th>Data</th><th>Valor</th><th>Status</th></tr>${D.contracts.map(c=>`<tr><td>${esc(c.client)}</td><td>${esc(c.event)}</td><td>${br(c.date)}</td><td>R$ ${money(c.value)}</td><td>${esc(c.status)}</td></tr>`).join('')||'<tr><td colspan=5 class=empty>Nenhum contrato.</td></tr>'}</table></div>`}function contractForm(){show(`<div class=mh><h2>Novo contrato</h2><button class=close onclick=closeM()>×</button></div><div class=formgrid><div><label>Cliente</label><input id=cc></div><div><label>Evento</label><input id=co></div><div><label>Data</label><input id=cx type=date></div><div><label>Horário</label><input id=ch type=time></div><div class=span2><label>Endereço</label><input id=ca></div><div><label>Pessoas</label><input id=cpo type=number></div><div><label>Valor</label><input id=cv type=number step=.01></div><div><label>Status</label><select id=cs><option>Em elaboração</option><option>Enviado</option><option>Aguardando confirmação</option><option>Confirmado</option><option>Cancelado</option></select></div><div class=span2><label>Condições / observações</label><textarea id=cb></textarea></div></div><button class="btn primary" style="margin-top:14px" onclick=saveContract()>Salvar</button>`)}async function saveContract(){await api('/api/save',{method:'POST',body:JSON.stringify({type:'contracts',data:{client:cc.value,event:co.value,date:cx.value,time:ch.value,address:ca.value,people:Number(cpo.value||0),value:Number(cv.value||0),status:cs.value,obs:cb.value}})});closeM();await load();pContracts()}
function pCalendar(){$('main').innerHTML=`<div class=head><h2>Calendário</h2><button class="btn primary" onclick=eventForm()>+ Novo evento</button></div><div class=card id=cal></div>`;renderCal()}function renderCal(){let y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];let s=`<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn dark" onclick="cal.setMonth(cal.getMonth()-1);renderCal()">‹</button><h3>${names[m]} ${y}</h3><button class="btn dark" onclick="cal.setMonth(cal.getMonth()+1);renderCal()">›</button></div><div class=calendar>`;['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(x=>s+=`<div style="text-align:center;color:#888">${x}</div>`);for(let i=0;i<first;i++)s+='<div></div>';for(let d=1;d<=days;d++){let dt=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;s+=`<div class=day><b>${d}</b>${D.events.filter(e=>e.date===dt).map(e=>`<span class=evt onclick="eventView(${e.id})">${esc(e.time)} ${esc(e.name)}</span>`).join('')}</div>`} $('cal').innerHTML=s+'</div>'}
function pixPage(){let cfg=D.settings;$('main').innerHTML=`<div class=head><h2>PIX / QR Code</h2></div><div class=card><p style=color:#aaa>Cadastre a chave PIX nas configurações. Depois informe um valor para gerar um QR Code PIX dinâmico.</p><div class=formgrid><div><label>Valor da cobrança</label><input id=pa type=number step=.01></div><div><label>Chave cadastrada</label><input value="${esc(cfg.pix_key||'')}" disabled></div></div><div class=actions><button class="btn primary" onclick=generatePix()>Gerar QR Code</button></div><div id=pixout></div></div>`}async function generatePix(){try{let x=await api('/api/pix?amount='+encodeURIComponent(pa.value));$('pixout').innerHTML=`<div class=pixbox style="margin-top:20px"><img class=piximg src="/api/qr?text=${encodeURIComponent(x.payload)}"><div><h3>QR Code PIX</h3><p><b>Chave:</b> ${esc(x.key)}<br><b>Valor:</b> R$ ${money(x.amount)}</p><textarea readonly>${esc(x.payload)}</textarea><div class=actions><button class="btn dark" onclick="navigator.clipboard.writeText(${JSON.stringify(x.payload)});alert('Código PIX copiado.')">Copiar código PIX</button></div></div></div>`}catch(e){alert(e.message)}}
function pSettings(){$('main').innerHTML=`<div class=head><h2>Configurações</h2></div><div class=grid2><div class=card><h3>👤 Perfil</h3><label>Nome</label><input id=sn><button class="btn primary" style="margin-top:12px" onclick=saveProfile()>Salvar perfil</button></div><div class=card><h3>🏢 Empresa</h3><label>Nome da empresa</label><input id=sc value="${esc(D.settings.company)}"><label>E-mail para lembretes</label><input id=se value="${esc(D.settings.email)}"><label>Nome do recebedor PIX</label><input id=smn value="${esc(D.settings.merchant_name)}"><label>Cidade do recebedor</label><input id=smc value="${esc(D.settings.merchant_city)}"><button class="btn primary" style="margin-top:12px" onclick=saveSettings()>Salvar dados</button></div><div class=card><h3>🔔 Lembrete por e-mail</h3><p style=color:#aaa>O servidor verifica eventos do dia seguinte e envia o lembrete uma vez por evento.</p><label><input id=rem type=checkbox style="width:auto;margin-right:7px" ${D.settings.reminder?'checked':''}> Ativar</label><label>SMTP</label><input id=sh placeholder="Servidor SMTP" value="${esc(D.settings.smtp_host)}"><input id=sp placeholder="Porta" type=number value="${D.settings.smtp_port||587}" style="margin-top:7px"><input id=su placeholder="Usuário SMTP" value="${esc(D.settings.smtp_user)}" style="margin-top:7px"><input id=sw placeholder="Senha SMTP" type=password value="${esc(D.settings.smtp_pass)}" style="margin-top:7px"><label><input id=tls type=checkbox style="width:auto;margin-right:7px" ${D.settings.smtp_tls?'checked':''}> Usar TLS</label><div class=actions><button class="btn primary" onclick=saveSettings()>Salvar lembrete</button><button class="btn dark" onclick=testEmail()>Testar e-mail</button></div></div><div class=card><h3>💳 Chave PIX</h3><label>Tipo</label><select id=ptx><option value="">Selecione</option><option ${D.settings.pix_type==='CPF'?'selected':''}>CPF</option><option ${D.settings.pix_type==='CNPJ'?'selected':''}>CNPJ</option><option ${D.settings.pix_type==='E-mail'?'selected':''}>E-mail</option><option ${D.settings.pix_type==='Telefone'?'selected':''}>Telefone</option><option ${D.settings.pix_type==='Aleatória'?'selected':''}>Aleatória</option></select><label>Chave PIX</label><input id=pk value="${esc(D.settings.pix_key)}"><button class="btn primary" style="margin-top:12px" onclick=saveSettings()>Salvar PIX</button><button class="btn dark" style="margin:12px 0 0 7px" onclick=pixPage()>Abrir QR Code</button></div></div>`;api('/api/me').then(x=>$('sn').value=x.user.name)}
async function saveSettings(){let o={company:sc.value,email:se.value,pix_type:ptx.value,pix_key:pk.value,merchant_name:smn.value,merchant_city:smc.value,reminder:rem.checked?1:0,smtp_host:sh.value,smtp_port:Number(sp.value||587),smtp_user:su.value,smtp_pass:sw.value,smtp_tls:tls.checked?1:0};await api('/api/settings',{method:'POST',body:JSON.stringify(o)});await load();alert('Configurações salvas.')}async function saveProfile(){let m=await api('/api/me');await api('/api/profile',{method:'POST',body:JSON.stringify({name:sn.value})});alert('Perfil salvo.')}async function testEmail(){await saveSettings();try{let x=await api('/api/test-email',{method:'POST'});alert(x.message)}catch(e){alert(e.message)}}boot();
</script></body></html>
